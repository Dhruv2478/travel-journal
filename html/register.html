<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Registration</title>
  <link rel="stylesheet" href="../css/form.css">
</head>
<body class="register-bg">

  <div class="form-container">
    <h2>Create Account</h2>
    <form name="registerForm" action="../php/register_process.php" method="POST" onsubmit="return validateForm()">
      
      <input type="text" id="username" name="username" placeholder="Username" onkeyup="checkField('username')">
      <span id="username-error" class="error-msg"></span>
      
      <input type="email" id="email" name="email" placeholder="Email" onkeyup="checkField('email')">
      <span id="email-error" class="error-msg"></span>
      
      <input type="password" id="password" name="password" placeholder="Password">
      <span class="error-msg"></span>
      
      <div class="button-group">
        <button type="submit" name="register">Register</button>
        <input type="reset" value="Clear" onclick="clearErrors()">
      </div>
    </form>
    <p>Already have an account? <a href="../php/login.php">Login here</a></p>
  </div>

<script>
function checkField(fieldName) {
  let fieldValue = document.getElementById(fieldName).value;
  let errorSpan = document.getElementById(fieldName + "-error");

  if (fieldValue.length < 3) {
    errorSpan.innerHTML = "";
    return;
  }

  let xhr = new XMLHttpRequest();
  xhr.open("GET", "../php/check_user.php?field=" + fieldName + "&value=" + encodeURIComponent(fieldValue), true);
  
  xhr.onreadystatechange = function() {
    if (xhr.readyState == 4 && xhr.status == 200) {
      let xmlDoc = xhr.responseXML;
      
      if (xmlDoc) {

        let statusCodeTag = xmlDoc.getElementsByTagName("status_code")[0];
        let errorMessageTag = xmlDoc.getElementsByTagName("error_message")[0];
 
        if (statusCodeTag && errorMessageTag && statusCodeTag.childNodes[0]) {
          let status = statusCodeTag.childNodes[0].nodeValue;
          
          if (status === "taken") {
            let errorText = errorMessageTag.childNodes[0].nodeValue;
            errorSpan.innerHTML = errorText; 
          } else {
            errorSpan.innerHTML = ""; 
          }
        }
      }
    }
  };
  xhr.send();
}

function submitRegistration(event) {
    event.preventDefault(); 

    if (!validateForm()) return;

    let formData = new FormData(document.forms['registerForm']);
    let xhr = new XMLHttpRequest();
    xhr.open("POST", "../php/register_process.php", true);

    xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {//xml display
            alert(xhr.responseText);
 
            window.location.href = "../php/login.php";
        }
    };
    xhr.send(formData);
}

</script>
</body>
</html>
